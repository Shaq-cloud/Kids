<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,400..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script src="https://cdn.tailwindcss.com"></script><script src="tailwind.config.js"></script><script src="scripts.js" defer></script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen welcome-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-20 px-margin-mobile flex items-center justify-between gap-space-sm"><div class="welcome-title-wrap"><span class="welcome-spark material-symbols-outlined" aria-hidden="true">auto_awesome</span><h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface truncate">Welcome!</h1><p class="welcome-subtitle">Ready for a fun day of learning?</p></div><div class="flex items-center gap-space-xs"><div class="welcome-star-count flex items-center bg-surface-container-lowest py-1 px-space-xs rounded-full shadow-[0_2px_0_0_#dce2f3]" aria-label="12 stars earned"><span class="material-symbols-outlined text-secondary-container text-[20px]" aria-hidden="true">stars</span><span class="font-title text-title text-on-secondary-container ml-0.5">12</span></div><img loading="lazy" alt="Profile" class="w-8 h-8 rounded-full object-cover" src="image-1.jpg"></div></div></header><main class="flex flex-col relative w-full px-margin-mobile pt-20 pb-safe bg-surface min-h-screen welcome-main"><div class="flex flex-col w-full pb-8">
<!-- Kofi Guidance & Audio Pod -->
<div class="relative flex items-center gap-space-sm bg-surface-container-low rounded-lg p-space-sm mb-space-md shadow-[0_4px_0_0_#dce2f3]">
<!-- Kofi Avatar -->
<div class="relative shrink-0 w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center overflow-hidden shadow-[0_3px_0_0_#ccc3d8]">
<img loading="lazy" alt="Prince the elephant mascot" class="buddy-face-image w-full h-full object-cover" data-learning-buddy-image src="Shaq.png">
<!-- Mascot sparkle pip -->
<span class="absolute top-1 right-1 text-secondary-container material-symbols-outlined text-[18px]" style="font-variation-settings: &quot;FILL&quot; 1;">auto_awesome</span>
</div>
<!-- Speech Bubble -->
<div class="relative flex-1 bg-surface-container-lowest rounded-DEFAULT p-space-sm shadow-[0_3px_0_0_#e2e8f8]">
<!-- Bubble tail -->
<div class="absolute -left-2 top-1/2 -translate-y-1/2 w-0 h-0 border-t-[8px] border-t-transparent border-b-[8px] border-b-transparent border-r-[10px] border-r-surface-container-lowest"></div>
<div class="flex items-center justify-between gap-space-xs">
<div class="min-w-0">
<p class="font-label-md text-label-md text-on-surface-variant">Your learning buddy, <span data-learning-buddy-name>Prince</span>, says:</p>
<p class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold truncate">"Ready to learn and play?"</p>
</div>
<!-- Chunky Audio Play Button -->
<button aria-label="Listen to Prince" data-buddy-aria-template="Listen to {buddy}" class="shrink-0 w-14 h-14 rounded-full bg-tertiary-fixed text-tertiary flex items-center justify-center shadow-[0_4px_0_0_#006e95] active:translate-y-1 active:shadow-[0_1px_0_0_#006e95] transition-all" id="voice-prompt-btn" type="button">
<span class="material-symbols-outlined text-[30px]" id="speaker-icon" style="font-variation-settings: &quot;FILL&quot; 1;">volume_up</span>
</button>
</div>
</div>
</div>
<!-- Big Chunky Name Input -->

<!-- Class Selection Section -->
<div class="flex flex-col gap-space-xs mb-space-lg">
<div class="flex items-center justify-between px-1">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface flex items-center gap-1.5">
<span class="material-symbols-outlined text-secondary-container text-[24px]" style="font-variation-settings: &quot;FILL&quot; 1;">school</span>
  Which class are you in?
      </h2>
<span class="font-label-md text-label-md text-on-surface-variant">Choose one</span>
</div>
<!-- Four large class choices -->
<div aria-label="Select your class" class="grid grid-cols-4 gap-space-xs" id="class-selector-group" role="radiogroup">
<!-- Class 1 -->
<button aria-checked="false" class="class-card relative flex flex-col items-center justify-between p-2 pt-3 pb-3 h-32 rounded-lg bg-surface-container-lowest shadow-[0_4px_0_0_#dce2f3] active:translate-y-1 transition-all" data-class="1" role="radio" type="button">
<span class="font-display-mobile text-display-mobile text-tertiary">Class <strong>1</strong></span>
<span class="class-decoration material-symbols-outlined text-tertiary" aria-hidden="true">menu_book</span>

</button>
<!-- Class 2 (Selected by default) -->
<button aria-checked="true" class="class-card relative flex flex-col items-center justify-between p-2 pt-3 pb-3 h-32 rounded-lg bg-secondary-fixed shadow-[0_4px_0_0_#f9bd22] active:translate-y-1 transition-all" data-class="2" role="radio" type="button">
<!-- Selected Checkmark Stamp -->
<div class="check-stamp absolute -top-2 -right-1 w-6 h-6 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-[0_2px_0_0_#5a00c6]">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<span class="font-display-mobile text-display-mobile text-on-secondary-fixed">Class <strong>2</strong></span>
<span class="class-decoration material-symbols-outlined text-on-secondary-container" aria-hidden="true">star</span>





</button>
<!-- Class 3 -->
<button aria-checked="false" class="class-card relative flex flex-col items-center justify-between p-2 pt-3 pb-3 h-32 rounded-lg bg-surface-container-lowest shadow-[0_4px_0_0_#dce2f3] active:translate-y-1 transition-all" data-class="3" role="radio" type="button">
<span class="font-display-mobile text-display-mobile text-primary">Class <strong>3</strong></span>
<span class="class-decoration material-symbols-outlined text-primary" aria-hidden="true">auto_stories</span>

</button>
<!-- Class 4+ -->
<button aria-checked="false" class="class-card relative flex flex-col items-center justify-between p-2 pt-3 pb-3 h-32 rounded-lg bg-surface-container-lowest shadow-[0_4px_0_0_#dce2f3] active:translate-y-1 transition-all" data-class="4+" role="radio" type="button">
<span class="font-display-mobile text-display-mobile text-secondary">Class <strong>4+</strong></span>
<span class="class-decoration material-symbols-outlined text-secondary" aria-hidden="true">school</span>
</button>
</div>
</div>
<!-- Pick a Learning Buddy / Character Avatar -->
<div class="flex flex-col gap-space-xs mb-space-lg">
<div class="flex items-center justify-between px-1">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary text-[24px]">pets</span>
        Pick your Buddy!
      </h2>
<span class="font-label-md text-label-md text-on-surface-variant">Tap to choose</span>
</div>
<!-- 4 Round Illustrated Buddy Avatars -->
<div aria-label="Select avatar buddy" class="grid grid-cols-4 gap-space-xs" id="buddy-selector-group" role="radiogroup">
<!-- Buddy 1: Prince (Selected) -->
<button aria-checked="true" class="buddy-btn relative flex flex-col items-center gap-1.5 p-2 rounded-lg bg-surface-container-low shadow-[0_4px_0_0_#7c3aed] active:translate-y-1 transition-all" data-buddy-name="Prince" data-buddy-image="Shaq.png" role="radio" type="button">
<div class="relative w-16 h-16 rounded-full bg-primary-fixed overflow-hidden shadow-[0_2px_0_0_#ccc3d8]">
<img loading="lazy" alt="Prince the elephant" class="buddy-face-image w-full h-full object-cover" src="Shaq.png">
<div class="buddy-check absolute -bottom-0.5 right-1 w-5 h-5 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[14px]">check</span>
</div>
</div>
<span class="font-label-md text-label-md text-primary font-bold">Prince</span>
</button>
<!-- Buddy 2: Pip -->
<button aria-checked="false" class="buddy-btn relative flex flex-col items-center gap-1.5 p-2 rounded-lg bg-surface-container-lowest shadow-[0_3px_0_0_#dce2f3] active:translate-y-1 transition-all" data-buddy-name="Pip" data-buddy-image="Pip.png" role="radio" type="button">
<div class="relative w-16 h-16 rounded-full bg-secondary-fixed overflow-hidden shadow-[0_2px_0_0_#dce2f3]">
<img loading="lazy" alt="Pip the bunny" class="buddy-face-image w-full h-full object-cover" src="Pip.png">
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Pip</span>
</button>
<!-- Buddy 3: Leo -->
<button aria-checked="false" class="buddy-btn relative flex flex-col items-center gap-1.5 p-2 rounded-lg bg-surface-container-lowest shadow-[0_3px_0_0_#dce2f3] active:translate-y-1 transition-all" data-buddy-name="Leo" data-buddy-image="Leo.png" role="radio" type="button">
<div class="relative w-16 h-16 rounded-full bg-surface-container-high overflow-hidden shadow-[0_2px_0_0_#dce2f3]">
<img loading="lazy" alt="Leo the lion" class="buddy-face-image w-full h-full object-cover" src="Leo.png">
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Leo</span>
</button>
<!-- Buddy 4: Toby -->
<button aria-checked="false" class="buddy-btn relative flex flex-col items-center gap-1.5 p-2 rounded-lg bg-surface-container-lowest shadow-[0_3px_0_0_#dce2f3] active:translate-y-1 transition-all" data-buddy-name="Toby" data-buddy-image="Toby.png" role="radio" type="button">
<div class="relative w-16 h-16 rounded-full bg-secondary-fixed-dim overflow-hidden shadow-[0_2px_0_0_#dce2f3]">
<img loading="lazy" alt="Toby the bear" class="buddy-face-image w-full h-full object-cover" src="Toby.png">
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Toby</span>
</button>
</div>
</div>
<!-- Big Tactile Pill Push Button CTA -->
<div class="flex flex-col gap-space-sm mt-space-xs">
<button class="w-full h-16 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center gap-space-xs shadow-[0_6px_0_0_#f59e0b] active:translate-y-1 active:shadow-[0_2px_0_0_#f59e0b] transition-all" id="go-cta-btn" type="button">
<span class="font-display-mobile text-display-mobile">Done! Let's Go!</span>
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: &quot;FILL&quot; 1;">rocket_launch</span>
</button>
<!-- Parent Gate Safe Footer Note -->
<div class="flex items-center justify-center gap-1.5 text-center px-space-sm py-1">
<span class="material-symbols-outlined text-[16px] text-outline">lock</span>
<p class="font-audio-caption text-audio-caption text-outline">
        Parent settings accessible anytime via 🔒 in top corner
      </p>
</div>
</div>
</div>

</body></html>
