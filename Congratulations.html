    <script>
      const playCelebration = async () => {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        let context;
        try {
          context = new AudioContextClass();
          if (context.state === "suspended") await context.resume();
          [523.25, 659.25, 783.99, 1046.5].forEach((frequency, index) => {
            const start = context.currentTime + index * 0.12;
            const oscillator = context.createOscillator();
            const volume = context.createGain();
            oscillator.type = "sine";
            oscillator.frequency.value = frequency;
            volume.gain.setValueAtTime(0.0001, start);
            volume.gain.exponentialRampToValueAtTime(0.16, start + 0.025);
            volume.gain.exponentialRampToValueAtTime(0.0001, start + 0.42);
            oscillator.connect(volume).connect(context.destination);
            oscillator.start(start);
            oscillator.stop(start + 0.43);
          });
          window.setTimeout(() => context.close(), 1000);
        } catch {
          // Sound is optional when the browser or device does not support it.
          context?.close();
        }
      };

      window.addEventListener("load", playCelebration, { once: true });
    </script>
