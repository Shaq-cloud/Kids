<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,400..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script src="https://cdn.tailwindcss.com"></script><script src="tailwind.config.js"></script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-20 px-margin-mobile flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-xs"><button aria-label="Go Back" class="w-12 h-12 rounded-full bg-surface-container-low text-primary flex items-center justify-center shadow-[0_3px_0_0_#dce2f3] active:translate-y-1 transition-all" data-action="go-back" type="button"><span class="material-symbols-outlined text-[26px]">arrow_back</span></button><img loading="lazy" alt="LittleSteps learning buddy" class="h-8 w-auto object-contain hidden xs:inline" src="image-2.jpg"></div><h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface truncate">Activity Play</h1><div class="flex items-center gap-space-xs"><div class="flex items-center bg-surface-container-lowest py-1 px-space-xs rounded-full shadow-[0_2px_0_0_#dce2f3]"><span class="material-symbols-outlined text-secondary-container text-[20px]">stars</span><span class="font-title text-title text-on-secondary-container ml-0.5">12</span></div><img loading="lazy" alt="Profile" class="w-8 h-8 rounded-full object-cover" src="image-1.jpg"></div></div></header><main class="flex flex-col relative w-full px-margin-mobile pt-20 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full pb-6 space-y-4">
<!-- Interactive Progress Header Strip -->
<div class="flex items-center justify-between px-2 pt-1">
<div class="flex items-center gap-space-xs bg-surface-container-low px-3 py-1.5 rounded-full shadow-[0_2px_0_0_#dce2f3]">
<span class="material-symbols-outlined text-primary-container text-[20px]" style="font-variation-settings: 'FILL' 1;">play_lesson</span>
<span class="font-label-md text-label-md text-primary font-bold">Story Lesson 1</span>
</div>
<!-- Quick Audio Mute / Unmute Pill -->
<button aria-label="Toggle Sound" class="w-11 h-11 rounded-full bg-surface-container-low flex items-center justify-center text-primary shadow-[0_3px_0_0_#dce2f3] active:translate-y-1 transition-transform" id="muteToggle">
<span class="material-symbols-outlined text-[24px]" id="muteIcon">volume_up</span>
</button>
</div>
<!-- Main Video Focus Canvas (16:9 Kid-Friendly Frame) -->
<div class="relative w-full aspect-video rounded-xl bg-surface-container-high overflow-hidden shadow-[0_8px_20px_-4px_rgba(99,14,212,0.18)]">
<!-- Scene Artwork / Animated Lesson Scene -->
<video aria-label="Number counting lesson video" class="lesson-video w-full h-full object-cover" id="lessonVideo" playsinline preload="metadata" poster="video-poster.jpg"><source src="Video%202.mp4" type="video/mp4"></video>
<div class="absolute bottom-3 left-3 z-10 rounded-full bg-surface-container-lowest/95 p-1.5 shadow-lg" aria-label="Your learning buddy"><img alt="Your learning buddy" class="h-9 w-9 rounded-full object-cover" data-learning-buddy-image src="Shaq.png"></div>
<!-- Ambient Subtle Play Overlay State -->
<!-- Active Floating Audio Ripples (Top Corner Indicator) -->
<div class="absolute top-3 right-3 flex items-center gap-1 bg-surface-container-lowest/90 backdrop-blur-md px-2.5 py-1 rounded-full shadow-sm">
<span class="w-2 h-2 rounded-full bg-secondary-container" id="videoStatusDot"></span>
<span class="font-audio-caption text-audio-caption text-on-surface-variant" id="videoStatusText">Ready to play</span>
</div>
</div>
<!-- Oversized Chunky Kid-Friendly Controls -->
<div class="bg-surface-container-lowest rounded-xl p-space-sm shadow-[0_6px_0_0_#dce2f3] flex flex-col gap-3">
<!-- Star Progress Timeline Bar -->
<div class="flex items-center gap-space-xs px-1">
<span class="font-label-md text-label-md text-primary font-bold" id="currentTime">0:00</span>
<div aria-label="Video progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" class="relative flex-1 h-5 flex items-center cursor-pointer select-none" id="progressTrack" role="slider" tabindex="0">
<!-- Base Track -->
<div class="w-full h-3 rounded-full bg-surface-container-highest overflow-hidden">
<div class="h-full bg-secondary-container rounded-full" id="progressBar" style="width: 0%;"></div>
</div>
<!-- Tactile Star Token Indicator -->
<div class="absolute left-0 -translate-x-1/2 w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shadow-[0_3px_0_0_#d99b00] transition-transform active:scale-125" id="starScrubber">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<span class="font-label-md text-label-md text-outline" id="durationTime">0:00</span>
</div>
<!-- Control Buttons Shelf -->
<div class="flex items-center justify-between px-2 pt-1">
<!-- Voice Replay 10s Backward -->
<button aria-label="Go back 10 seconds" class="w-14 h-14 rounded-full bg-surface-container-low text-primary flex items-center justify-center shadow-[0_4px_0_0_#dce2f3] active:translate-y-1 transition-all" id="replayBtn" type="button">
<span class="material-symbols-outlined text-[28px]">replay_10</span>
</button>
<!-- Giant Center Yellow-Orange Play/Pause Button -->
<button aria-label="Play lesson video" class="w-20 h-20 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shadow-[0_6px_0_0_#d99b00] active:translate-y-1 active:shadow-[0_2px_0_0_#d99b00] transition-all transform scale-100 active:scale-95" id="playPauseBtn" type="button">
<span class="material-symbols-outlined text-[48px]" id="playPauseIcon" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<!-- Voice Volume / Read Aloud Toggle -->
<button aria-label="Mute video" class="w-14 h-14 rounded-full bg-tertiary-fixed text-tertiary flex items-center justify-center shadow-[0_4px_0_0_#7bd0ff] active:translate-y-1 transition-all" id="speakerBtn" type="button">
<span class="material-symbols-outlined text-[28px]" id="speakerIcon" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
</div>
<!-- Kofi Guidance Speech Pod (Below Video) -->

<!-- Big Tactile Green Next Action Button -->
<div class="pt-2 flex justify-center">
<a class="w-full max-w-xs min-h-[56px] px-5 py-2 rounded-full bg-tertiary-container text-on-tertiary flex items-center justify-center gap-3 shadow-[0_5px_0_0_#004c69] active:translate-y-1 active:shadow-[0_1px_0_0_#004c69] transition-all group" href="Page 4.html" id="nextPracticeBtn">
<span class="font-title text-title tracking-normal text-on-tertiary text-center">
        Next: Let's Try!
      </span>
<div class="w-9 h-9 rounded-full bg-on-tertiary/20 flex items-center justify-center group-hover:translate-x-1 transition-transform">
<span class="material-symbols-outlined text-[26px] text-on-tertiary">arrow_forward</span>
</div>
</a>
</div>
</div>
<script src="scripts.js" defer></script></main>

</body></html>
